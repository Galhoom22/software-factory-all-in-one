name: Question about using the kit
description: How do I start / where does X live / how does the factory activate?
title: "[question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Start with [`00-USAGE.md`](https://github.com/Galhoom22/software-factory-all-in-one/blob/main/00-USAGE.md) and the README. Keep questions forever generic.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do with the kit?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you already read
      placeholder: README · 00-USAGE · coverage/…
  - type: checkboxes
    id: generic
    attributes:
      label: Forever-generic confirmation
      options:
        - label: No product/private data in this question
          required: true
