name: Bug or broken check
description: Something in the kit is wrong, unclear, or a script/CI gate fails.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping raise the craft. Keep this report **forever generic** — no product names, people, secrets, or real personal data.
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: What you expected vs what happened.
      placeholder: e.g. check-forever-generic.mjs fails on a false positive for …
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, paths, or steps from a fresh clone of this repo.
      placeholder: |
        1. git clone …
        2. node scripts/…
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS + Node version (optional).
      placeholder: Windows 11 · Node 26
  - type: checkboxes
    id: generic
    attributes:
      label: Forever-generic confirmation
      options:
        - label: This report contains no product/private data
          required: true
