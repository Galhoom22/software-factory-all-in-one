name: Prototype bug
description: Something on a project-ui screen looks or behaves wrong.
labels: [project-ui, bug]
body:
  - type: input
    id: url
    attributes:
      label: Screen URL
      description: Include ?state= and ?lang= if used.
      placeholder: /settings?state=S01-saved&lang=en
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: checkboxes
    id: where
    attributes:
      label: Where it happens
      options:
        - label: Right-to-left language
        - label: Left-to-right language
        - label: Dark theme
        - label: Phone width
  - type: markdown
    attributes:
      value: Attach a screenshot. Never paste real personal data; the prototype uses fictional data only.
