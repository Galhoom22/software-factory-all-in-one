# Copy to: <frontend-repo>/.github/workflows/ci.yml
# Pin action SHAs before relying on branch protection. Match node-version to SRS Active LTS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit / component tests
        run: npm test

      - name: Build
        run: npm run build

      # Add Playwright (or equivalent) only when the product TESTING guide requires it on PRs.
